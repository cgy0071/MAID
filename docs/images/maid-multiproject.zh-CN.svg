<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">切换项目，也能找回原任务</title><desc id="desc">索引记住任务在哪里。只有接入同一项目控制器的任务才共享调度。 一名项目秘书: 按项目名切换; 本地项目索引: 项目名＋任务名 → 工作目录; 项目 B: 独立的任务记录; 项目 A: 任务 A1、A2; 同项目共享控制器: 协调执行者、预算与文件写入; 重开后查任务: 找回原证据，不重新派工.</desc>
<style>
text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2328}.bg{fill:#ffffff;stroke:#d0d7de}.s{fill:#eef1f4;stroke:#7d8590}.g{fill:#dafbe1;stroke:#4b9866}.o{fill:#fff1da;stroke:#b27826}.b{fill:#ddf4ff;stroke:#54aeff}.edge{fill:none;stroke:#59636e;stroke-width:1.6}.tip{fill:#59636e}
@media(prefers-color-scheme:dark){text{fill:#f0f6fc}.bg{fill:#0d1117;stroke:#3d444d}.s{fill:#20262e;stroke:#9aa4af}.g{fill:#123322;stroke:#57ab75}.o{fill:#382817;stroke:#cd994e}.b{fill:#0c2d6b;stroke:#388bfd}.edge{stroke:#aab5bf}.tip{fill:#aab5bf}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="tip" d="M0 0L10 5L0 10Z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="959" height="349" rx="12"/>
<text x="30" y="36" font-size="24" font-weight="650">切换项目，也能找回原任务</text><text x="30" y="65" font-size="15">索引记住任务在哪里。只有接入同一项目控制器的任务才共享调度。</text>
<path class="edge" d="M270 126 H355" marker-end="url(#arrow)"/>
<path class="edge" d="M600 126 H685" marker-end="url(#arrow)"/>
<path class="edge" d="M480 160 V205" marker-end="url(#arrow)"/>
<path class="edge" d="M600 244 H685" marker-end="url(#arrow)"/>
<path class="edge" d="M360 244 H275" marker-end="url(#arrow)"/>
<rect class="b" x="30" y="92" width="240" height="68" rx="10"/>
<text x="42" y="120" font-size="17" font-weight="650">一名项目秘书</text><text x="42" y="144" font-size="13">按项目名切换</text>
<rect class="s" x="360" y="92" width="240" height="68" rx="10"/>
<text x="372" y="120" font-size="17" font-weight="650">本地项目索引</text><text x="372" y="144" font-size="13">项目名＋任务名 → 工作目录</text>
<rect class="s" x="690" y="92" width="240" height="68" rx="10"/>
<text x="702" y="120" font-size="17" font-weight="650">项目 B</text><text x="702" y="144" font-size="13">独立的任务记录</text>
<rect class="s" x="360" y="210" width="240" height="68" rx="10"/>
<text x="372" y="238" font-size="17" font-weight="650">项目 A</text><text x="372" y="262" font-size="13">任务 A1、A2</text>
<rect class="o" x="690" y="210" width="240" height="68" rx="10"/>
<text x="702" y="238" font-size="17" font-weight="650">同项目共享控制器</text><text x="702" y="262" font-size="13">协调执行者、预算与文件写入</text>
<rect class="s" x="30" y="210" width="240" height="68" rx="10"/>
<text x="42" y="238" font-size="17" font-weight="650">重开后查任务</text><text x="42" y="262" font-size="13">找回原证据，不重新派工</text>
<rect class="b" x="32" y="316" width="15" height="15" rx="4"/><text x="56" y="329" font-size="14">参与角色</text><rect class="s" x="314" y="316" width="15" height="15" rx="4"/><text x="338" y="329" font-size="14">记录与结果</text><rect class="o" x="596" y="316" width="15" height="15" rx="4"/><text x="620" y="329" font-size="14">核验与控制</text>
</svg>
